name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Every check is evaluated and every non-VM check is built. The NixOS
      # VM tests (checks.*.nixos-*) run locally only (`make vm-test`,
      # ADR-0016): on the shared runners they were slow and stalled.
      - name: Nix checks (without VM tests)
        run: nix develop --command make nix-check-novm

      - name: Format check
        run: nix develop --command make fmt-check

      - name: Lint
        run: nix develop --command make lint

      - name: Go tests
        run: nix develop --command make test

      - name: Go tests (race detector)
        run: nix develop --command make test-race

      # Known vulnerabilities reachable from Strata's code, in the Go
      # toolchain pinned by flake.lock or in Go modules (ADR-0022).
      - name: govulncheck
        run: nix develop --command make vulncheck

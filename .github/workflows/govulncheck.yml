# Reports known vulnerabilities in the Go standard library and modules
# Strata uses, to code scanning. The Go toolchain comes from flake.lock, so
# a standard library fix usually means merging the pending flake.lock
# update (ADR-0022). CI (ci.yml) fails on the same findings; this workflow
# also runs weekly, so new advisories surface without a commit.
name: govulncheck

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # SARIF output always exits 0; the findings are judged in code scanning.
      - name: govulncheck (SARIF)
        run: nix develop --command govulncheck -format sarif ./... > govulncheck.sarif

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

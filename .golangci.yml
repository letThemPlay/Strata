# golangci-lint v2 configuration.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gochecknoglobals
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - wrapcheck
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: unused-parameter
    misspell:
      locale: US
      # CANCELLED is an operation state named by the specification
      # (CLAUDE.md §9).
      ignore-rules:
        - cancelled
  exclusions:
    generated: strict
    rules:
      # Table-driven test fixtures are commonly package-level.
      - path: _test\.go
        linters:
          - gochecknoglobals
      # Test fakes implement standard interfaces (fs.FS, io.Writer) and must
      # pass errors through unchanged.
      - path: _test\.go
        linters:
          - wrapcheck
      # Tests read files they created themselves under t.TempDir().
      - path: _test\.go
        linters:
          - gosec
        text: "G304"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/letthemplay/Strata
